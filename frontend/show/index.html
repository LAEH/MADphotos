<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MADphotos</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#ffffff" id="theme-color">
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://madphotos.laeh.ai">
    <meta property="og:title" content="MADphotos">
    <meta property="og:description" content="10 years of Photography">
    <meta property="og:image" content="https://madphotos.laeh.ai/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MADphotos">
    <meta name="twitter:description" content="10 years of Photography">
    <meta name="twitter:image" content="https://madphotos.laeh.ai/og-image.png">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').then(function(reg) {
                    reg.addEventListener('updatefound', function() {
                        var w = reg.installing;
                        if (!w) return;
                        w.addEventListener('statechange', function() {
                            if (w.state === 'installed' && navigator.serviceWorker.controller) {
                                w.postMessage({ type: 'SKIP_WAITING' });
                                window.location.reload();
                            }
                        });
                    });
                });
            });
        }
    </script>
</body>
</html>
